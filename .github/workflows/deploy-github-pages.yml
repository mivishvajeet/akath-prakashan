name: Deploy Akath Prakashan to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-bundle:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify pre-built static assets for GitHub Pages
        run: |
          test -f index.html
          test -f 404.html
          test -f manifest.json
          test -f assets/app-bundle.js
          test -f assets/index.css
          echo "GitHub Pages static bundle verified."
