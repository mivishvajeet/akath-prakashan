name: Deploy Akath Prakashan to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-bundle:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs and root static assets for GitHub Pages
        run: |
          test -d docs
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/manifest.json
          test -f docs/assets/app-bundle.js
          test -f docs/assets/index.css
          echo "GitHub Pages /docs static bundle verified."
