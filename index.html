    <script
      type="module"
      src="./src/main.tsx"
      onerror="window.__loadAkathStaticBundle && window.__loadAkathStaticBundle()"
    ></script>
    <script>
      (function () {
        var bundleLoaded = false;
        window.__loadAkathStaticBundle = function () {
          if (bundleLoaded) return;
          bundleLoaded = true;
          window.__AKATH_STATIC_BUNDLE_ACTIVE__ = true;
          var mainScript = document.querySelector('script[src*="src/main.tsx"]');
          if (mainScript && mainScript.parentNode) {
            mainScript.parentNode.removeChild(mainScript);
          }
          if (!document.querySelector('link[href*="assets/index.css"]')) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './assets/index.css';
            document.head.appendChild(link);
          }
          if (!document.querySelector('script[src*="assets/app-bundle.js"]')) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = './assets/app-bundle.js';
            document.body.appendChild(script);
          }
        };

        var hasRawMainTsx = Boolean(
          document.querySelector('script[src*="src/main.tsx"]')
        );
        var hasViteClient = Boolean(
          document.querySelector('script[src*="@vite/client"]')
        );
        if (hasRawMainTsx && !hasViteClient) {
          window.__loadAkathStaticBundle();
        }
      })();
    </script>
  </body>
