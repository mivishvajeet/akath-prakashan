<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Akath Prakashan</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var route = path.charAt(0) === '/' ? path.slice(1) : path;
        window.location.replace('/?/' + route.replace(/&/g, '~and~') + (search ? '&' + search.slice(1).replace(/&/g, '~and~') : '') + hash);
      })();
    </script>
  </head>
  <body><p>Redirecting to Akath Prakashan…</p></body>
</html>
